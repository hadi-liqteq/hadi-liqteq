name: Deploy site to GitHub Pages

# Publishes the repo root (index.html + engine + theme) to GitHub Pages.
# Uses configure-pages with enablement:true so Pages is turned on automatically
# on the first run — no manual Settings step required.

on:
  push:
    branches: ["claude/coarts-lighting-redesign-b3z4l0"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
